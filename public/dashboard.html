<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #360033, #0b8793);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dashboard-container {
      width: 90%;
      max-width: 1200px;
      margin-top: 50px;
    }

    .dashboard-header {
      text-align: left;
      margin-bottom: 30px;
    }

    .dashboard-header h1 {
      margin: 0;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dashboard-card {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title i {
      margin-right: 10px;
    }

    .schedule-list {
      list-style: none;
      padding: 0;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .recent-attendance-table {
      width: 100%;
      border-collapse: collapse;
    }

    .recent-attendance-table th, .recent-attendance-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .recent-attendance-table th {
      font-weight: 600;
    }

    .status-present {
      color: #4CAF50;
    }

    .status-absent {
      color: #f44336;
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-card {
        margin-bottom: 20px;
      }

      .recent-attendance-table th,
      .recent-attendance-table td {
        padding: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1 id="student-name">Student Dashboard</h1>
    </div>

    <div class="dashboard-grid">
      <div class="dashboard-card">
        <div class="card-title">
          <i class="fas fa-calendar-check"></i>
          <h2>Attendance Overview</h2>
        </div>
        <div style="width: 200px; height: 200px; margin: auto;">
          <canvas id="attendanceChart"></canvas>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="card-title">
          <i class="fas fa-clock"></i>
          <h2>Today's Schedule</h2>
        </div>
        <ul class="schedule-list" id="scheduleList"></ul>
      </div>
    </div>

    <div class="dashboard-card">
      <div class="card-title">
        <i class="fas fa-history"></i>
        <h2>Last 7 Days Attendance</h2>
      </div>
      <table class="recent-attendance-table">
        <thead>
          <tr>
            <th>DATE</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="attendanceBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const res = await fetch('/student-dashboard');
        const data = await res.json();

        if (data.success) {
          const present = data.presentPercent;
          const absent = data.absentPercent;

          // Pie chart
          const ctx = document.getElementById('attendanceChart').getContext('2d');
          new Chart(ctx, {
            type: 'pie',
            data: {
              labels: ['Present', 'Absent'],
              datasets: [{
                data: [present, absent],
                backgroundColor: ['#4CAF50', '#f44336']
              }]
            },
            options: {
              plugins: {
                legend: {
                  labels: {
                    color: '#fff'
                  }
                }
              }
            }
          });

          // Last 7 days table
          const tableBody = document.getElementById('attendanceBody');
          tableBody.innerHTML = '';
          data.recent.forEach(record => {
            const row = `<tr>
                <td>${record.date}</td>
                <td class="${record.status === 'Present' ? 'status-present' : 'status-absent'}">${record.status}</td>
              </tr>`;
            tableBody.innerHTML += row;
          });
        }
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    async function loadSchedule() {
      try {
        const res = await fetch('/today-schedule');
        const data = await res.json();

        if (data.success) {
          const schedule = data.schedule;
          const times = ['12:00 - 1:00', '1:00 - 2:00', '2:00 - 3:00'];
          const subjects = [schedule.slot3, schedule.slot4, schedule.slot5];

          const scheduleList = document.getElementById('scheduleList');
          scheduleList.innerHTML = '';
          subjects.forEach((subject, i) => {
            scheduleList.innerHTML += `<li class="schedule-item">
                <span>${subject}</span>
                <span>${times[i]}</span>
              </li>`;
          });
        }
      } catch (err) {
        console.error('Error loading schedule:', err);
      }
    }

    window.onload = () => {
      loadDashboard();
      loadSchedule();
    };
  </script>
</body>
</html>
