<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register Student</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #360033, #0b8793);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .page-wrapper {
      width: 100%;
      padding: 50px 5%;
    }
    .form-box {
      background-color: #fff;
      border-radius: 12px;
      padding: 40px;
      max-width: 1000px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .form-group label {
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    .form-group input {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #3498db;
    }
    .form-group.full {
      grid-column: span 2;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
    }
    .password-wrapper .toggle-password {
      position: absolute;
      top: 38px;
      right: 10px;
      cursor: pointer;
      font-size: 16px;
      color: #555;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    .success-message {
      color: #2ecc71;
      text-align: center;
      margin-top: 15px;
    }
    .error-message {
      color: #e74c3c;
      text-align: center;
      margin-top: 15px;
    }
    @media (max-width: 768px) {
      form {
        grid-template-columns: 1fr;
      }
      .form-group.full {
        grid-column: span 1;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-wrapper">
    <div class="form-box">
      <h2>Register New Student</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" required />
        </div>
        <div class="form-group">
          <label>Class (e.g., SY BCA)</label>
          <input type="text" name="class" required />
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address" required />
        </div>
        <div class="form-group">
          <label>Semester</label>
          <input type="text" name="semester" required />
        </div>
        <div class="form-group">
          <label>Birth Date</label>
          <input type="text" name="birth_year" id="birth_year" placeholder="e.g. 22/06/2005 or 2005-06-22" required />
        </div>
        <div class="form-group">
          <label>Student ID</label>
          <input type="text" id="student_id_generated" name="student_id" readonly />
        </div>
        <div class="form-group password-wrapper">
          <label>Generated Password</label>
          <input type="text" id="generatedPassword" name="password" readonly />
          <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>
        <div class="form-group full">
          <button type="submit">Register</button>
        </div>
      </form>
      <div id="message" class="success-message"></div>
      <div id="error" class="error-message"></div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwField = document.getElementById("generatedPassword");
      pwField.type = pwField.type === "text" ? "password" : "text";
    }

    const nameInput = document.querySelector('input[name="name"]');
    const birthInput = document.getElementById('birth_year');
    const studentIdField = document.getElementById('student_id_generated');
    const passwordField = document.getElementById('generatedPassword');

    async function generateStudentData() {
      const name = nameInput.value.trim();
      const birth = birthInput.value.trim();

      if (name.length >= 4 && birth.length >= 4) {
        let year = birth;
        if (birth.includes('/')) {
          year = birth.split('/').pop();
        } else if (birth.includes('-')) {
          year = birth.split('-')[0];
        }

        try {
          const res = await fetch('/last-student-id');
          const data = await res.json();
          const nextId = data.nextId || 'STU101';

          studentIdField.value = nextId;
          passwordField.value = name.substring(0, 4).toLowerCase() + year + '@';
        } catch (err) {
          console.error('Error fetching student ID:', err);
        }
      }
    }

    nameInput.addEventListener('input', generateStudentData);
    birthInput.addEventListener('input', generateStudentData);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/register-student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
          document.getElementById('message').textContent = result.message;
          document.getElementById('error').textContent = '';
          form.reset();
          studentIdField.value = '';
          passwordField.value = '';
        } else {
          document.getElementById('error').textContent = result.message;
          document.getElementById('message').textContent = '';
        }
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('error').textContent = 'Something went wrong!';
      }
    });
  </script>
</body>
</html>
